<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>Token API</title>
    <meta name="title" content="Token API" />
    <meta
      name="description"
      content="Access all leading AI models—OpenAI, Claude, Gemini, and more—with a single API key. Unified gateway, OpenAI-compatible format, and pay-as-you-go pricing."
    />

    <meta name="theme-color" content="#fff" />
    <!-- 主站不参与搜索引擎索引：对外曝光由独立的静态落地站承担，
         两套同源内容同时开放索引会互相稀释权重。
         落地站见仓库根目录 landing/。 -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
